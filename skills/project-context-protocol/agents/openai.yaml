interface:
  display_name: "Project Context Protocol"
  short_description: "Cold-start, route, record, and hand off any project"
  default_prompt: "Use $project-context-protocol before other project work. First ask me for an explicit absolute project-context storage path and one layout (vault, markdown, or hybrid), and wait if either is missing. Then recover the bounded Project Profile and Recovery Card, begin a traceable run, and preserve an evidence-backed handoff without prescribing the solution method."
policy:
  allow_implicit_invocation: true
